<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Restaurante Sabor Caseiro</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <h1>Restaurante Sabor Caseiro</h1>
      <p>Pratos simples, feitos com carinho.</p>

        <figure>
          <img
            src="../Aula06/imagens/macarrao-tomate.svg"
            alt="Macarrão ao molho"
          />
          <figcaption>Macarrão ao molho — R$ 25</figcaption>
        </figure>
        <figure>
          <img src="../Aula06/imagens/bolo-cenoura.svg" alt="Bolo de cenoura" />
          <figcaption>Bolo de cenoura — R$ 12</figcaption>
        </figure>
        <figure>
          <img
            src="../Aula06/imagens/sanduiche-natural.svg"
            alt="Sanduíche natural"
          />
          <figcaption>Sanduíche natural — R$ 18</figcaption>
        </figure>
      </section>

</html>
