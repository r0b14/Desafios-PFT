<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Reserva de mesa</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <h1>Reserva de mesa</h1>
      <form>
        <label for="nome">Nome</label
        ><input id="nome" type="text" placeholder="Digite seu nome" />
        <label for="pessoas">Quantidade de pessoas</label
        ><input id="pessoas" type="number" min="1" />
        <label for="data">Data da reserva</label><input id="data" type="date" />
        <button type="submit">Reservar</button>
      </form>
    </main>
  </body>
</html>
