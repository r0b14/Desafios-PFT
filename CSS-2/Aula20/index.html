<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aula 20 - Bordas Arredondadas</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <p class="aula">AULA 20</p>
      <h1>Bordas Arredondadas e Formas</h1>
      <p class="descricao">Construção de formas com a propriedade <code>border-radius</code>.</p>

      <section class="formas-grid">
        <div class="forma forma-suave">
          <strong>Canto Suave</strong>
          <small>border-radius: 8px</small>
        </div>

        <div class="forma forma-pilula">
          <strong>Botão Pílula</strong>
          <small>border-radius: 9999px</small>
        </div>

        <div class="forma forma-circulo">
          <strong>Círculo</strong>
          <small>50%</small>
        </div>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
