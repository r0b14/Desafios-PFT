<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aula 21 - Gradientes CSS</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <p class="aula">AULA 21</p>
      <h1>Fundos com Gradientes</h1>
      <p class="descricao">Transição suave de cores com <code>linear-gradient</code> e <code>radial-gradient</code>.</p>

      <section class="grade-gradientes">
        <div class="card card-linear">
          <h3>Gradiente Linear</h3>
          <p>Transição horizontal suave entre duas tonalidades de azul e roxo.</p>
        </div>

        <div class="card card-radial">
          <h3>Gradiente Radial</h3>
          <p>Transição circular que se espalha do centro para as bordas.</p>
        </div>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
