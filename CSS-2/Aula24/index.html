<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aula 24 - Introdução ao Flexbox</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <p class="aula">AULA 24</p>
      <h1>Introdução ao Flexbox</h1>
      <p class="descricao">Ativando o modelo flexível com <code>display: flex</code> e controlando com <code>flex-direction</code>.</p>

      <h2>Disposição em Linha (flex-direction: row)</h2>
      <div class="flex-container flex-linha">
        <div class="flex-item">Item 1</div>
        <div class="flex-item">Item 2</div>
        <div class="flex-item">Item 3</div>
      </div>

      <h2>Disposição em Coluna (flex-direction: column)</h2>
      <div class="flex-container flex-coluna">
        <div class="flex-item">Passo A</div>
        <div class="flex-item">Passo B</div>
        <div class="flex-item">Passo C</div>
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
