<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aula 39 - Filtros CSS</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <p class="aula">AULA 39</p>
      <h1>Efeitos com filter</h1>
      <p class="descricao">Tratamento de imagens no navegador com a propriedade <code>filter</code>.</p>

      <section class="galeria-filtros">
        <div class="item-filtro">
          <img
            src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/25.png"
            alt="Pikachu"
            class="foto-pb"
          />
          <p>Passe o mouse para colorir (grayscale)</p>
        </div>

        <div class="item-filtro">
          <img
            src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/133.png"
            alt="Eevee"
            class="foto-blur"
          />
          <p>Passe o mouse para focar (blur)</p>
        </div>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
