<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Calculadora básica</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <p class="tag">AULA 36</p>
    <h1>Calculadora básica</h1>
    <p>Pratique arrow functions, <code>switch</code> e operador ternário.</p>
    <div class="campos">
      <label>Primeiro número <input id="primeiroNumero" type="number" value="10"></label>
      <label>Operação <select id="operacao"><option value="somar">Soma (+)</option><option value="subtrair">Subtração (−)</option></select></label>
      <label>Segundo número <input id="segundoNumero" type="number" value="5"></label>
    </div>
    <button id="calcular">Calcular</button>
    <output id="resultado" aria-live="polite">Preencha os valores e calcule.</output>
  </main>
  <script src="script.js"></script>
</body>
</html>
