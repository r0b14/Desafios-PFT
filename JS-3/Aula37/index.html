<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checklist de qualidade</title><link rel="stylesheet" href="style.css"></head>
<body><main><p class="tag">AULA 37</p><h1>Checklist de qualidade</h1><p>Uma página organizada para praticar o papel do Prettier e do ESLint.</p><form id="formulario"><label for="nome">Nome <input id="nome" required></label><label for="email">E-mail <input id="email" type="email" required></label><label for="mensagem">Mensagem <textarea id="mensagem" required></textarea></label><button>Enviar</button></form><p id="retorno" aria-live="polite"></p><section><h2>Lista de tarefas</h2><ul id="tarefas"><li>Formatar o projeto com Prettier</li><li>Corrigir avisos indicados pelo ESLint</li><li>Revisar nomes de variáveis</li></ul><button type="button" id="adicionar">Adicionar tarefa</button></section></main><script src="script.js"></script></body></html>
