<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lista de tarefas assíncrona</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <p class="aula">AULA 41</p>
      <h1>Lista de tarefas</h1>
      <p>Adicionar e remover tarefas são operações assíncronas simuladas.</p>
      <form id="formulario">
        <input
          id="nova-tarefa"
          required
          placeholder="Ex.: Estudar Promises"
        /><button>Adicionar</button>
      </form>
      <p id="mensagem"></p>
      <ul id="tarefas"></ul>
    </main>
    <script src="script.js"></script>
  </body>
</html>
