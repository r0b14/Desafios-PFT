<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Busca Pokémon</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <p class="aula">AULA 43</p>
      <h1>Busca Pokémon</h1>
      <p>
        Digite o nome ou número de um Pokémon, como <strong>pikachu</strong> ou
        <strong>25</strong>.
      </p>
      <input id="busca" placeholder="Nome ou número" /><button id="buscar">
        Buscar
      </button>
      <p id="mensagem"></p>
      <section id="pokemon" hidden>
        <img id="imagem" alt="Pokémon encontrado" />
        <h2 id="nome"></h2>
        <p id="tipo"></p>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
