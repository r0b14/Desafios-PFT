<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formatador de data</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <p class="aula">AULA 49</p>
      <h1>Formatador de data</h1>
      <p>
        Use os formatos <strong>DD_MM_AAAA</strong>,
        <strong>DD-MM-AAAA</strong> ou <strong>DD.MM.AAAA</strong>.
      </p>
      <input id="data" value="07-10-2026" /><button id="formatar">
        Formatar data
      </button>
      <p id="resultado"></p>
    </main>
    <script src="script.js"></script>
  </body>
</html>
