<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aula 53 - Análise de Idades Inglês Fácil</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <p class="aula">AULA 53</p>
      <h1>Curso de Inglês "Inglês Fácil"</h1>
      <p class="descricao">
        Análise da faixa etária dos alunos utilizando métodos de iteração em arrays.
      </p>

      <!-- Exibição do array base -->
      <div class="bloco-info">
        <strong>Lista de idades cadastradas:</strong>
        <p id="exibicao-idades"></p>
      </div>

      <!-- Filtro por idade X -->
      <label for="idade-corte">Idade de referência (X):</label>
      <input type="number" id="idade-corte" value="18" min="1" max="100" />

      <div class="botoes-grade">
        <button id="btn-mais-x">Mais de X anos</button>
        <button id="btn-menos-x">Menos de X anos</button>
        <button id="btn-media">Calcular Média</button>
        <button id="btn-extremos">Mais Novo e Mais Velho</button>
        <button id="btn-5-jovens">5 Mais Jovens</button>
        <button id="btn-5-velhos">5 Mais Velhos</button>
      </div>

      <!-- Painel de Resultados -->
      <h2>Resultado da análise:</h2>
      <div id="resultado-painel">Clique em um dos botões acima para executar a análise.</div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
